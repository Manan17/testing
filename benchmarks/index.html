<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liger Performance Over Commits</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Liger Performance Over Commits</h1>

    <!-- Pagination controls -->
    <div class="pagination-controls">
      <button id="prevPage">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Next</button>
    </div>

    <div class="chart-section">
      <h2>Memory Performance (Lower is Better)</h2>
      <canvas id="memoryHistoryChart"></canvas>
    </div>

    <div class="chart-section">
      <h2>Speed Performance (Lower is Better)</h2>
      <canvas id="speedHistoryChart"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
